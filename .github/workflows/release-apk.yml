name: release-apk
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.6
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NetraAssistant-${TAG}-debug.apk"
          gh release upload "$TAG" "NetraAssistant-${TAG}-debug.apk" --clobber --repo "${{ github.repository }}"
